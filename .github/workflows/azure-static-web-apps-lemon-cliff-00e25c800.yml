name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
      - release/*
      - it/*
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - release/*
      - it/*

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      # Checkout repo
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      # Cài dependencies
      - name: Install dependencies
        run: npm install

      # Build app với biến VITE từ GitHub Secrets
      - name: Build Vite App
        run: |
          export VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_DEV_URL }}
          export VITE_OTHER_SECRET=${{ secrets.VITE_OTHER_SECRET }}
          # In ra debug (ẩn secret) để kiểm tra biến có tồn tại
          echo "VITE_API_BASE_URL=$VITE_API_BASE_URL"
          npm run build

      # Deploy lên Azure Static Web Apps
      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_CLIFF_00E25C800 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/" 
          api_location: "" 
          output_location: "dist"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_CLIFF_00E25C800 }}
          action: "close"

